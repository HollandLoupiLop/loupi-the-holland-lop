# À copier (le moment venu) dans le dépôt AI Trading Desk :
#   .github/workflows/security-review.yml
# Prérequis : secret de dépôt CLAUDE_API_KEY (clé API Anthropic autorisée pour
# l'API et Claude Code), et dans Settings > Actions : « Require approval for all
# external contributors » (l'action n'est pas durcie contre l'injection de prompt).
# Action épinglée sur le commit audité le 2026-10-27 (dernier commit amont :
# 2026-02-11 — à réauditer avant d'activer).
name: Security Review

permissions:
  pull-requests: write   # commentaires sur la PR
  contents: read

on:
  pull_request:

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    # Pas d'exécution sur les PR venant de forks (secrets + injection de prompt).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        with:
          comment-pr: true
          upload-results: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          claude-model: claude-opus-5-5
          claudecode-timeout: 20
          exclude-directories: node_modules,dist,build,.venv,data
          # Optionnel, pour un desk de trading :
          # custom-security-scan-instructions: .github/security/trading-scan.txt
